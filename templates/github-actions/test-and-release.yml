# Copy to .github/workflows/test-and-release.yml in the adapter repository.
# Официальный шаблон @iobroker/create-adapter.
# Публикация выполняется через ioBroker/testing-action-deploy@v1.
# Настрой Trusted Publisher на npmjs.com для репозитория (owner/repository/workflow filename).
name: Test and Release

on:
  push:
    tags:
      - 'v[0-9]+.[0-9]+.[0-9]+'
      - 'v[0-9]+.[0-9]+.[0-9]+-*'

permissions:
  contents: write
  id-token: write

jobs:
  check-and-lint:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout tagged source
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: '22.x'
          registry-url: 'https://registry.npmjs.org'

      - name: Install dependencies
        run: npm ci

      - name: Build
        run: npm run build

      - name: Lint
        run: npm run lint

      - name: Check and lint via ioBroker testing-action-check
        uses: ioBroker/testing-action-check@v1

  adapter-tests:
    needs: [check-and-lint]
    runs-on: ubuntu-latest
    steps:
      - name: Checkout tagged source
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: '22.x'
          registry-url: 'https://registry.npmjs.org'

      - name: Install dependencies
        run: npm ci

      - name: Build
        run: npm run build

      - name: Adapter tests via ioBroker testing-action-adapter
        uses: ioBroker/testing-action-adapter@v1

  deploy:
    needs: [adapter-tests]
    runs-on: ubuntu-latest
    steps:
      - name: Checkout tagged source
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: '22.x'
          registry-url: 'https://registry.npmjs.org'

      - name: Install dependencies
        run: npm ci

      - name: Build
        run: npm run build

      - name: Publish prerelease or stable release
        uses: ioBroker/testing-action-deploy@v1
        with:
          node-version: "22.x"
          github-token: ${{ secrets.GITHUB_TOKEN }}
          # npm-token НЕ указывается при Trusted Publishing

      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" --generate-notes --verify-tag
