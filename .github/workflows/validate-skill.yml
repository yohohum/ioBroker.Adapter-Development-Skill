name: Validate Skill repository

on:
  push:
    branches: [main, master]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout source
        uses: actions/checkout@v6

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: '24'
          registry-url: 'https://registry.npmjs.org'

      - name: Install dependencies
        run: npm ci

      - name: Run full regression test suite
        run: npm test

      - name: Validate Skill repository structure and consistency
        run: npm run validate

      - name: Validate shell syntax
        run: bash -n scripts/run-adapter-checks.sh
