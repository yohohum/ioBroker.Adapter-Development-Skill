name: Validate Skill repository

on:
  push:
    branches: [main, master]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout source
        uses: actions/checkout@v6

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: '24'
          registry-url: 'https://registry.npmjs.org'

      - name: Install dependencies
        run: npm ci

      - name: Validate required files, JavaScript, YAML, JSON, and local links
        run: node scripts/validate-skill.mjs

      - name: Validate shell syntax
        run: bash -n scripts/run-adapter-checks.sh

      - name: Run translation checks test fixtures
        run: node scripts/check-translations.mjs test/fixtures/translations/full --mode=new

      - name: Run release preflight test fixtures
        run: node scripts/release-preflight.mjs test/fixtures/release/correct --profile=create-adapter-default
