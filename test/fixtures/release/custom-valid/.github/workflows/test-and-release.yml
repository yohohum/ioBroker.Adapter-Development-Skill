name: Tag release

on:
  push:
    tags:
      - 'v*'
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  check-and-lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: '24'
      - run: npm ci
      - run: npm run build
      - run: npm run lint
      - run: npm run test:package

  adapter-tests:
    needs: [check-and-lint]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: '24'
      - run: npm ci
      - run: npm run test:integration

  deploy:
    needs: [check-and-lint, adapter-tests]
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: write
      id-token: write
    steps:
      - uses: actions/checkout@v6
      - name: Release guard
        shell: bash
        run: |
          set -euo pipefail
          # release-guard-contract: v1
          # Validate tag format: must be v<SemVer> with no whitespace
          TAG_RAW="${GITHUB_REF_NAME}"
          case "$TAG_RAW" in
            *[[:space:]]*) echo "::error::Invalid release tag"; exit 1 ;;
          esac
          case "$TAG_RAW" in
            v[0-9]*) ;;
            *) echo "::error::Invalid release tag"; exit 1 ;;
          esac
          TAG_NOPREFIX="${TAG_RAW#v}"
          TAG_VERSION=$(node -e '
            // Pure SemVer 2.0.0 validation without external dependencies
            const v = process.argv[1];

            // Regex for SemVer 2.0.0
            // Based on https://semver.org/#is-there-a-suggested-regular-expression-regex-to-check-a-semver-string
            const semverRegex = /^(0|[1-9]\d*)\.(0|[1-9]\d*)\.(0|[1-9]\d*)(?:-((?:0|[1-9]\d*|\d*[a-zA-Z-][0-9a-zA-Z-]*)(?:\.(?:0|[1-9]\d*|\d*[a-zA-Z-][0-9a-zA-Z-]*))*))?(?:\+([0-9a-zA-Z-]+(?:\.[0-9a-zA-Z-]+)*))?$/;

            const match = v.match(semverRegex);
            if (!match) {
              process.exit(1);
            }

            // Additional validation: no leading zeros in numeric prerelease identifiers
            if (match[1]) {
              const prereleaseParts = match[1].split(".");
              for (const part of prereleaseParts) {
                if (/^\d+$/.test(part) && part.length > 1 && part.startsWith("0")) {
                  process.exit(1);
                }
              }
            }

            // Build metadata can have leading zeros, no additional validation needed

            // Return version without build metadata for comparison with package.json
            console.log(v.replace(/\+.*$/, ""));
          ' "$TAG_NOPREFIX") || { echo "::error::Invalid release tag"; exit 1; }
          PKG_VERSION="$(node -p "require('./package.json').version")"
          IO_VERSION="$(node -p "require('./io-package.json').common.version")"
          if [ "$TAG_VERSION" != "$PKG_VERSION" ] || [ "$TAG_VERSION" != "$IO_VERSION" ]; then
            echo "::error::Release versions do not match"
            exit 1
          fi
          PACKAGE_NAME="$(node -p "require('./package.json').name")"
          set +e
          NPM_VIEW_OUTPUT="$(npm view "$PACKAGE_NAME@$PKG_VERSION" version 2>&1)"
          NPM_VIEW_STATUS=$?
          set -e
          if [ "$NPM_VIEW_STATUS" -eq 0 ]; then
            echo "::error::Package version already exists"
            exit 1
          fi
          if ! printf '%s' "$NPM_VIEW_OUTPUT" | grep -Eq 'E404|404 Not Found|is not in (this|the) npm registry|No match found for version'; then
            echo "::error::Unable to verify npm publication state: $NPM_VIEW_OUTPUT"
            exit 1
          fi
      - uses: actions/setup-node@v6
        with:
          node-version: '24'
          registry-url: 'https://registry.npmjs.org'
          package-manager-cache: false
      - name: Pin npm CLI for Trusted Publishing
        run: npm install --global npm@11.5.1
      - run: npm ci
      - run: npm run build
      - name: Publish with npm Trusted Publishing
        run: npm publish
      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" --generate-notes --verify-tag
